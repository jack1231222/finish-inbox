<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">FinishInbox</title>
  <desc id="desc">A macOS menu bar inbox for finished coding-agent tasks.</desc>
  <rect width="1280" height="640" fill="#0B1020"/>
  <circle cx="1110" cy="70" r="270" fill="#12372A" opacity="0.58"/>
  <circle cx="80" cy="620" r="260" fill="#172554" opacity="0.46"/>
  <g transform="translate(96 104)">

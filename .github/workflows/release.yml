name: Release

on:
  push:
    tags:
      - 'v0.1.*'
      - '!*-free*'

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref_name, 'v0.1.') && !contains(github.ref_name, '-free')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift toolchain
        run: swift --version
      - name: Validate tag version
        id: version
        shell: bash
        run: |
          version="$(python3 scripts/release-channel.py "$GITHUB_REF_NAME")"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Run tests
        run: swift test
      - name: Run isolated CLI integration stress
        run: python3 -u scripts/integration-stress.py
      - name: Check README image references
        run: scripts/check-readme-assets.sh
      - name: Scan source and resources for private strings
        run: scripts/privacy-scan.sh Sources Resources README.md README.zh-CN.md docs scripts .github
      - name: Build release artifacts
        run: scripts/package-release.sh '${{ steps.version.outputs.value }}'
      - name: Verify real app launch across two state roots
        run: python3 -u scripts/app-launch-smoke.py
      - name: Upload GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          test -f "docs/releases/v$VERSION.md"
          gh release create "$GITHUB_REF_NAME" \
            "dist/FinishInbox-v$VERSION.zip" \
            "dist/FinishInbox-v$VERSION.zip.sha256" \
            "dist/FinishInbox-v$VERSION.manifest.json" \
            --verify-tag \
            --prerelease \
            --notes-file "docs/releases/v$VERSION.md" \
            --title "FinishInbox $VERSION"
